name: Nivora
options:
  bundleIdPrefix: dev.zyvor
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.2.0

targets:
  Nivora:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    resources:
      - path: ../agent/nivora.py
        buildPhase: resources
      - path: ../agent/nivora_core.py
        buildPhase: resources
      - path: ../web
        buildPhase: resources
    # xcodegen regenerates these plist/entitlements files on every run: keys must be declared here.
    info:
      path: Config/Nivora-Info.plist
      properties:
        NSSystemExtensionUsageDescription: Nivora uses a content-filter system extension to attribute network flows to applications. It observes metadata only; no payloads are collected.
    entitlements:
      path: Config/Nivora.entitlements
      properties:
        com.apple.developer.system-extension.install: true
        com.apple.developer.networking.networkextension: [content-filter-provider-systemextension]
        com.apple.security.application-groups: [group.dev.zyvor.nivora]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zyvor.nivora
        PRODUCT_NAME: Nivora
    dependencies:
      - target: NivoraFilter
        embed: true
        codeSign: true

  NivoraFilter:
    type: system-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: FilterData
      - path: Shared
    info:
      path: Config/FilterData-Info.plist
      properties:
        CFBundlePackageType: SYSX
        NetworkExtension:
          NEMachServiceName: $(TeamIdentifierPrefix)dev.zyvor.nivora.filter
          NEProviderClasses:
            com.apple.networkextension.filter-data: $(PRODUCT_MODULE_NAME).FilterDataProvider
    entitlements:
      path: Config/NivoraFilter.entitlements
      properties:
        com.apple.developer.networking.networkextension: [content-filter-provider-systemextension]
        com.apple.security.application-groups: [group.dev.zyvor.nivora]
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zyvor.nivora.filter
        PRODUCT_NAME: dev.zyvor.nivora.filter
        SKIP_INSTALL: YES

  NivoraTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
        excludes: ["Fixtures"]
      - path: App/Model/Snapshot.swift
      - path: App/Model/Alerts.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zyvor.nivora.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
