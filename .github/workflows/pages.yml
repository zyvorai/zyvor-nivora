name: pages

# Landing page plus the real dashboard on simulated telemetry under /demo/.
# Enable once in the repo: Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "web/**"
      - "docs/ux/**"
      - "docs/social/**"
      - "docs/brand/**"
      - "scripts/build-site.sh"
      - "scripts/build-site-data.py"
      - "scripts/build-docs.py"
      - "scripts/build-site-terminal.py"
      - "README.md"
      - "agent/**"
      - "docs/**"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - "package.json"
      - "scripts/site-check.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on:  [self-hosted, mini]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Self-hosted Mac: use its own python3 and node. actions/setup-python tries to create
      # /Users/runner (a GitHub-hosted path) and fails here.
      - name: Release checksums (shown only if the release lists this version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v$(python3 -c "import json;print(json.load(open('package.json'))['version'])")" -p SHA256SUMS.txt || true
      - run: ./scripts/build-site.sh
      - run: node scripts/site-check.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
