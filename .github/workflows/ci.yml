name: verify
# Self-hosted Mac runner (label mini). This repo is public, so pull requests from forks are skipped:
# they must not run code on that machine.
on:
  push:
  pull_request:

jobs:
  portable:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, mini]
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test.sh

  macos-native:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, mini]
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test.sh
      - run: brew install xcodegen
      - run: ./scripts/build-native.sh
      - run: |
          cd native
          xcodebuild -project Nivora.xcodeproj -scheme NivoraTests -destination 'platform=macOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO test
